<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>功效分析 · URS DS Tools</title>
    <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
    <link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml">
    <script>
      (function () {
        try {
          var m = localStorage.getItem('urs-ds-theme');
          if (m !== 'light' && m !== 'dark') {
            m = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', m);
        } catch (e) {}
      })();
    </script>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-VQV08H7W6V"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-VQV08H7W6V');
    </script>
    <link rel="stylesheet" href="../../assets/apple-theme.css">
    <link rel="stylesheet" href="power-analysis.css">
    <link rel="stylesheet" href="../../assets/changelog.css">
</head>
<body class="urs-app power-analysis">
    <a class="skip-link" href="#main">跳到主内容</a>
    <button class="watermark" id="changelog-watermark" onclick="openChangelog()" title="点击查看更新日志" type="button">URS数据科学团队 © 2026</button>
    <div class="changelog-overlay" id="changelog-overlay" onclick="closeChangelogOnOverlay(event)">
        <div class="changelog-modal" role="dialog" aria-labelledby="changelog-title">
            <div class="changelog-header">
                <span class="changelog-title" id="changelog-title">更新日志</span>
                <button class="changelog-close" onclick="closeChangelog()" aria-label="关闭" type="button">✕</button>
            </div>
            <div class="changelog-body" id="changelog-body"></div>
        </div>
    </div>

    <div class="app-shell">
        <header class="app-topbar">
            <a class="app-back" href="../../index.html">← 首页</a>
            <button type="button" class="theme-toggle" id="theme-toggle" aria-label="切换到深色模式" title="深色模式">
                <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M21.752 15.002A9.718 9.718 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998z"/>
                </svg>
                <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591 1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773-1.591-1.591M15.75 12a3.75 3.75 0 0 1-7.5 0 3.75 3.75 0 0 1 7.5 0z"/>
                </svg>
            </button>
        </header>

        <main id="main">
            <header class="tool-header">
                <h1>功效分析</h1>
                <p class="tool-subtitle">分析统计功效如何随实验天数增长，确定实验的最优时长</p>
            </header>

            <div class="seg-row">
                <div class="seg-control scenario-switch" role="tablist" aria-label="分析场景">
                    <button type="button" class="scenario-btn active" data-scenario="monitoring" role="tab" aria-selected="true" onclick="switchScenario('monitoring')">
                        <span class="seg-btn-short">观测</span><span class="seg-btn-full">长期观测</span>
                    </button>
                    <button type="button" class="scenario-btn" data-scenario="ab-test" role="tab" aria-selected="false" onclick="switchScenario('ab-test')">
                        <span class="seg-btn-short">AB</span><span class="seg-btn-full">AB 测试</span>
                    </button>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <div><div class="card-title">实验参数</div><div class="card-desc">填写实验流量与效应量，分析功效随时间的变化趋势</div></div>
                </div>

                <div class="traffic-mode-row" id="traffic-mode-row">
                    <span class="traffic-mode-label">AB 流量输入</span>
                    <div class="seg-control">
                        <button type="button" class="traffic-mode-btn active" data-mode="ratio" onclick="setTrafficMode('ratio')">总量 + 比例</button>
                        <button type="button" class="traffic-mode-btn" data-mode="direct" onclick="setTrafficMode('direct')">分组直接输入</button>
                    </div>
                </div>

                <div class="form-grid">
                    <div class="form-group" id="field-daily-n">
                        <label>日均流量 <span class="tooltip tip-left" data-tip="每天进入实验的用户总数。AB 测试中按分流比例分配。">ⓘ</span></label>
                        <input type="number" id="daily-n" min="1" step="1" placeholder="例如 10000">
                    </div>
                    <div class="form-group" id="field-split">
                        <label>分流比例 (A : B) <span class="tooltip tip-left" data-tip="对照组与实验组的流量分配比例。非等比分流需要更多总样本量。">ⓘ</span></label>
                        <select id="split-ratio">
                            <option value="1:1">1 : 1</option>
                            <option value="1:2">1 : 2</option>
                            <option value="2:1">2 : 1</option>
                            <option value="1:3">1 : 3</option>
                        </select>
                    </div>
                    <div class="form-group" id="field-daily-na" style="display:none">
                        <label>A 组日均流量 <span class="tooltip tip-left" data-tip="对照组每天进入实验的用户数量。">ⓘ</span></label>
                        <input type="number" id="daily-na" min="1" step="1" placeholder="例如 5000">
                    </div>
                    <div class="form-group" id="field-daily-nb" style="display:none">
                        <label>B 组日均流量 <span class="tooltip tip-left" data-tip="实验组每天进入实验的用户数量。">ⓘ</span></label>
                        <input type="number" id="daily-nb" min="1" step="1" placeholder="例如 5000">
                    </div>
                    <div class="form-group">
                        <label>基准转化率 p₀ <span class="tooltip tip-left" data-tip="当前历史转化率，填写百分比数值，如 60 代表 60%。">ⓘ</span></label>
                        <div class="input-suffix" data-suffix="%"><input type="number" id="p0" step="0.1" placeholder="例如 60"></div>
                    </div>
                    <div class="form-group">
                        <label>目标 MDE δ <span class="tooltip tip-left" data-tip="期望检测到的最小效应量（绝对百分点）。留空则仅显示 MDE 曲线。">ⓘ</span></label>
                        <div class="input-suffix" data-suffix="%"><input type="number" id="delta" step="0.1" placeholder="可选"></div>
                    </div>
                    <div class="form-group">
                        <label>显著性水平 α <span class="tooltip tip-left" data-tip="误报率上限。α 越小，结论越保守，所需样本量越大。">ⓘ</span></label>
                        <select id="alpha">
                            <option value="0.05">0.05</option>
                            <option value="0.10">0.10</option>
                            <option value="0.20">0.20</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>目标功效 <span class="tooltip tip-left" data-tip="MDE 曲线以此功效为计算标准；功效曲线中的参考线也取此值。">ⓘ</span></label>
                        <select id="target-power">
                            <option value="0.80">80%</option>
                            <option value="0.70">70%</option>
                            <option value="0.90">90%</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>最多观测天数 <span class="tooltip tip-left" data-tip="横轴最大天数，建议设为实验计划最长周期。">ⓘ</span></label>
                        <input type="number" id="max-days" value="28" min="2" step="1">
                    </div>
                </div>
                <div class="action-row">
                    <button type="button" class="btn btn-primary" onclick="run()">运行分析</button>
                </div>
            </div>

            <div class="validation-banner" id="validation-banner" role="alert" aria-live="polite" hidden></div>

            <div class="results-section" id="results">
                <div class="metric-grid cols-3" id="summary-grid"></div>
                <div class="chart-grid">
                    <div class="chart-wrap">
                        <div class="chart-title">功效曲线</div>
                        <div class="chart-subtitle" id="power-subtitle"></div>
                        <div id="power-chart"></div>
                    </div>
                    <div class="chart-wrap">
                        <div class="chart-title">MDE 曲线</div>
                        <div class="chart-subtitle" id="mde-subtitle"></div>
                        <div id="mde-chart"></div>
                    </div>
                </div>
                <div class="formula-section">
                    <div class="formula-label">公式说明</div>
                    <div class="formula-text" id="formula-text"></div>
                </div>
            </div>
        </main>
    </div>

<script src="../../assets/theme.js"></script>
<script type="module" src="js/ui.js"></script>
<script src="../../assets/changelog.js" data-page="power-analysis" data-base="../../"></script>
</body>
</html>
