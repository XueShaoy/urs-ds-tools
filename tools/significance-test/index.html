<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>显著性检验 · URS DS Tools</title>
    <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
    <link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml">
    <script>
      (function () {
        try {
          var m = localStorage.getItem('urs-ds-theme');
          if (m !== 'light' && m !== 'dark') {
            m = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', m);
        } catch (e) {}
      })();
    </script>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-VQV08H7W6V"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-VQV08H7W6V');
    </script>
    <link rel="stylesheet" href="../../assets/apple-theme.css">
    <link rel="stylesheet" href="significance-test.css">
    <link rel="stylesheet" href="../../assets/changelog.css">
</head>
<body class="urs-app significance-test">
    <a class="skip-link" href="#main">跳到主内容</a>
    <button class="watermark" id="changelog-watermark" onclick="openChangelog()" title="点击查看更新日志" type="button">URS数据科学团队 © 2026</button>

    <div class="changelog-overlay" id="changelog-overlay" onclick="closeChangelogOnOverlay(event)">
        <div class="changelog-modal" role="dialog" aria-labelledby="changelog-title">
            <div class="changelog-header">
                <span class="changelog-title" id="changelog-title">更新日志</span>
                <button class="changelog-close" onclick="closeChangelog()" aria-label="关闭" type="button">✕</button>
            </div>
            <div class="changelog-body" id="changelog-body"></div>
        </div>
    </div>

    <div class="app-shell">
        <header class="app-topbar">
            <a class="app-back" href="../../index.html">← 首页</a>
            <button type="button" class="theme-toggle" id="theme-toggle" aria-label="切换到深色模式" title="深色模式">
                <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M21.752 15.002A9.718 9.718 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998z"/>
                </svg>
                <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591 1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773-1.591-1.591M15.75 12a3.75 3.75 0 0 1-7.5 0 3.75 3.75 0 0 1 7.5 0z"/>
                </svg>
            </button>
        </header>

        <main id="main">
            <header class="tool-header">
                <h1>显著性检验</h1>
                <p class="tool-subtitle">z 比例检验 · 森林图可视化 · 本地 CSV 导入导出</p>
            </header>

            <div class="seg-row">
                <div class="seg-control scenario-switch" role="tablist" aria-label="检验类型">
                    <button type="button" class="scenario-btn active" data-test="single" role="tab" aria-selected="true" onclick="switchTest('single')">
                        <span class="seg-btn-short">单样</span><span class="seg-btn-full">单样本检验</span>
                    </button>
                    <button type="button" class="scenario-btn" data-test="two" role="tab" aria-selected="false" onclick="switchTest('two')">
                        <span class="seg-btn-short">双样</span><span class="seg-btn-full">双样本检验</span>
                    </button>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <div><div class="card-title">检验参数</div><div class="card-desc">设定显著性水平、检验方向与多重比较校正</div></div>
                </div>
                <div class="form-grid">
                    <div class="form-group">
                        <label>显著性水平 α <span class="tooltip tip-left" data-tip="假阳性率。α=0.05 表示 5% 概率误报。置信区间置信度为 1−α。">ⓘ</span></label>
                        <input type="number" id="alpha" step="0.01" min="0.001" max="0.5" value="0.05">
                    </div>
                    <div class="form-group">
                        <label>检验方向 <span class="tooltip tip-left" data-tip="双侧：检验是否存在差异（≠）。单侧：检验是否更大（>）或更小（<）。">ⓘ</span></label>
                        <select id="tail">
                            <option value="two">双侧检验 (≠)</option>
                            <option value="greater">右侧检验 (&gt;)</option>
                            <option value="less">左侧检验 (&lt;)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>多重比较校正 <span class="tooltip tip-left" data-tip="同时检验多个指标时整体误报率会膨胀。Bonferroni 最保守；Holm 检验力更高；BH 控制错误发现率（FDR）。">ⓘ</span></label>
                        <select id="correction">
                            <option value="none">不校正</option>
                            <option value="bonferroni">Bonferroni</option>
                            <option value="holm">Holm-Bonferroni</option>
                            <option value="bh">Benjamini-Hochberg (FDR)</option>
                        </select>
                    </div>
                    <div class="form-group" id="default-p0-group">
                        <label>默认基准比例 p₀ <span class="tooltip tip-left" data-tip="单样本检验中，每个指标与该基准比例比较。表格中可对每行单独覆盖（%）。">ⓘ</span></label>
                        <input type="number" id="default-p0" step="0.1" min="0" max="100" value="50" placeholder="例如 50">
                    </div>
                </div>
                <div class="info-box" id="param-info"></div>
            </div>

            <div class="card">
                <div class="card-header">
                    <div><div class="card-title">指标数据</div><div class="card-desc">手动录入，或导入本地 CSV 文件</div></div>
                </div>

                <div class="data-toolbar">
                    <button type="button" class="btn btn-secondary btn-sm" onclick="addRow()">添加指标</button>
                    <button type="button" class="btn btn-secondary btn-sm" onclick="loadSample()">加载示例数据</button>
                    <button type="button" class="btn btn-secondary btn-sm" onclick="clearRows()">清空</button>
                    <div class="spacer"></div>
                    <button type="button" class="btn btn-secondary btn-sm" onclick="downloadTemplate()">下载 CSV 模板</button>
                </div>

                <div class="table-scroll">
                    <table class="data-table">
                        <thead id="data-thead"></thead>
                        <tbody id="data-tbody"></tbody>
                    </table>
                </div>

                <div class="dropzone" id="csv-dropzone">
                    点击或拖拽 <strong>.csv</strong> 文件到此处导入
                    <span class="dz-hint" id="dz-hint"></span>
                </div>
                <input type="file" id="csv-file" accept=".csv,text/csv" hidden>
                <div class="csv-status" id="csv-status"></div>
            </div>

            <div class="action-row">
                <button type="button" class="btn btn-secondary" onclick="clearRows()">重置</button>
                <button type="button" class="btn btn-primary" onclick="runTest()">运行检验</button>
            </div>

            <div class="validation-banner" id="validation-banner" role="alert" aria-live="polite" hidden></div>

            <div class="results-section" id="results">
                <div class="card">
                    <div class="card-header">
                        <div><div class="card-title">检验结果</div><div class="card-desc" id="result-desc"></div></div>
                    </div>

                    <div class="metric-grid" id="summary-grid"></div>

                    <h4 class="section-title">森林图 · 效应量与置信区间</h4>
                    <div class="forest-wrap">
                        <div id="forest"></div>
                    </div>
                    <div class="forest-legend">
                        <span class="lg"><span class="dot dot-up"></span>显著（高于基准 / A&gt;B）</span>
                        <span class="lg"><span class="dot dot-down"></span>显著（低于基准 / A&lt;B）</span>
                        <span class="lg"><span class="dot dot-neutral"></span>不显著</span>
                        <span class="lg"><span style="width:18px;border-top:2px dashed var(--apple-secondary);display:inline-block"></span>基准线（差异=0）</span>
                    </div>

                    <div class="section-header-row">
                        <h4 class="section-title">明细</h4>
                        <button type="button" class="btn btn-secondary btn-sm" onclick="downloadResults()">下载结果 CSV</button>
                    </div>
                    <div class="table-container">
                        <table class="results-table">
                            <thead id="res-thead"></thead>
                            <tbody id="res-tbody"></tbody>
                        </table>
                    </div>

                    <div class="formula-section">
                        <div class="formula-label">公式说明</div>
                        <div class="formula-text" id="formula"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

<script src="../../assets/theme.js"></script>
<script type="module" src="js/ui.js"></script>
<script src="../../assets/changelog.js" data-page="significance-test" data-base="../../"></script>
</body>
</html>
